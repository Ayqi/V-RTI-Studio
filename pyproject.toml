# Project tooling only: the add-on itself is packaged by Blender (vrti/blender_manifest.toml).
[tool.ruff]
target-version = "py311"   # the Python bundled with Blender 4.2 - 4.5
line-length = 120
extend-exclude = ["dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E402",   # tests and bl_info need code before imports
    "B905",   # zip() lengths are checked where it matters
]

[tool.ruff.lint.per-file-ignores]
"vrti/properties.py" = ["F722", "F821"]   # Blender property annotations
"tests/*" = ["E501", "E701", "E702", "B007"]
